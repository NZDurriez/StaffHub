<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Staff Tool Hub</title>
  <link rel="icon" type="image/svg+xml" href="hub-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 290px;
      flex: none;
      background: linear-gradient(180deg, #14171e, #101319);
      border-right: 1px solid var(--line);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .sidebar::-webkit-scrollbar { display: none; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 22px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .brand svg { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 0 14px rgba(245,165,36,.35)); }
    .brand h1 { margin: 0; font-size: 20px; line-height: 1.1; }
    .brand small { display: block; color: var(--muted); font: 500 12px var(--font); margin-top: 3px; letter-spacing: .02em; }

    .sidebar h2, .nav-label {
      font: 600 11px var(--font);
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #6b7386;
      margin: 18px 10px 8px;
      padding: 0;
      border: 0;
    }

    .link-button {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0;
      padding: 10px 12px;
      font: 500 14.5px var(--font);
      color: #c3c8d4;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      box-shadow: none;
      transition: background .15s, color .15s, border-color .15s;
    }
    .link-button:hover { background: rgba(255,255,255,.04); color: var(--ink); filter: none; box-shadow: none; }
    .link-button:active { transform: none; }
    .link-button.active {
      color: var(--ink);
      background: var(--honey-soft);
      border-color: rgba(245,165,36,.3);
    }
    .link-button.active .link-label svg { stroke: var(--honey); }

    .external { color: #9aa1b2; font-size: 14px; }

    .link-label { display: flex; align-items: center; gap: 12px; }
    .link-label svg { width: 20px; height: 20px; stroke: currentColor; flex: none; transition: stroke .15s; }

    .sidebar-foot {
      margin-top: auto;
      padding: 18px 10px 0;
      color: #5d6577;
      font-size: 12px;
    }

    /* ---------- Content ---------- */
    .iframes {
      flex-grow: 1;
      width: 100%;
      height: 100vh;
      position: relative;
    }

    .tool-frame {
      position: absolute;
      inset: 0;
      border: none;
      width: 100%;
      height: 100%;
      display: none;
      background: transparent;
    }
    .tool-frame.active { display: block; }

    /* Welcome screen, shown until a tool is picked */
    .welcome {
      position: absolute;
      inset: 0;
      overflow: auto;
      padding: 56px 48px;
    }
    .welcome[hidden] { display: none; }
    .welcome-inner { max-width: 960px; margin: 0 auto; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font: 600 12px var(--font); letter-spacing: .08em; text-transform: uppercase;
      color: var(--honey);
      background: var(--honey-soft);
      border: 1px solid rgba(245,165,36,.3);
      padding: 5px 12px; border-radius: 999px;
    }
    .welcome h2 { font-size: clamp(30px, 4vw, 44px); margin: 16px 0 8px; line-height: 1.05; }
    .welcome p.lead { color: var(--muted); font-size: 16px; margin: 0 0 32px; max-width: 560px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .card {
      text-align: left;
      display: flex; flex-direction: column; gap: 10px;
      margin: 0;
      padding: 18px;
      color: var(--ink);
      background: linear-gradient(180deg, var(--card-2), var(--card));
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: none;
      font: inherit;
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .card:hover { border-color: rgba(245,165,36,.5); transform: translateY(-2px); filter: none; box-shadow: 0 16px 34px -18px rgba(245,165,36,.45); }
    .card .ico {
      width: 40px; height: 40px; display: grid; place-items: center;
      border-radius: 11px; background: var(--honey-soft); border: 1px solid rgba(245,165,36,.25);
    }
    .card .ico svg { width: 22px; height: 22px; stroke: var(--honey); }
    .card b { font: 700 16px var(--display); }
    .card span { color: var(--muted); font-size: 13.5px; line-height: 1.45; }

    /* ---------- Refresh button ---------- */
    .refresh-icon-wrapper {
      position: absolute;
      bottom: 22px;
      right: 22px;
      z-index: 1000;
    }
    .refresh-icon {
      width: 44px;
      height: 44px;
      color: #1a1204;
      background: linear-gradient(180deg, var(--honey-2), var(--honey));
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 10px 26px -8px rgba(245,165,36,.8), 0 1px 0 rgba(255,255,255,.35) inset;
      transition: filter .15s;
    }
    .refresh-icon svg { width: 22px; height: 22px; stroke-width: 2; }
    .refresh-icon:hover { filter: brightness(1.08); }
    .refresh-icon.spin svg { animation: spin .6s ease; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .refresh-icon::after {
      content: "Click to refresh this page\AHold to refresh all pages";
      white-space: pre-line;
      position: absolute;
      bottom: 54px;
      right: 0;
      background: var(--card-2);
      color: var(--ink);
      border: 1px solid var(--line-2);
      padding: 8px 12px;
      border-radius: 10px;
      font: 500 12.5px/1.5 var(--font);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      width: max-content;
      text-align: right;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
    .refresh-icon:hover::after { opacity: 1; }

    /* ---------- Small screens ---------- */
    @media (max-width: 820px) {
      body { flex-direction: column; height: auto; min-height: 100vh; overflow: auto; }
      .sidebar { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px; }
      .sidebar-foot { display: none; }
      .iframes { height: calc(100vh - 60px); min-height: 600px; }
      .welcome { padding: 28px 16px; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand" onclick="showHome()" title="Home">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 3 42 13.5v21L24 45 6 34.5v-21L24 3Z" fill="url(#hg)"/>
        <path d="M24 13.5 33 18.75v10.5L24 34.5l-9-5.25v-10.5L24 13.5Z" fill="#1a1204" opacity=".85"/>
        <path d="M24 19.5 28 21.8v4.6l-4 2.3-4-2.3v-4.6l4-2.3Z" fill="#ffc35c"/>

      </svg>
      <div><h1>Staff Tool Hub</h1><small>Beehive RP staff toolkit</small></div>
    </div>

    <div class="nav-label">Tools</div>

    <button class="link-button" onclick="showTool('tool-civ')">

    <button class="link-button" onclick="showTool('tool-commands')">
      <span class="link-label">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 9.75a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375m-13.5 3.01c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.184-4.183a1.14 1.14 0 0 1 .778-.332 48.294 48.294 0 0 0 5.83-.498c1.585-.233 2.708-1.626 2.708-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />

        Commands
      </span>
    </button>

    <!-- External Tools -->
    <h2>External Tools</h2>

          <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 17.25v-.228a4.5 4.5 0 0 0-.12-1.03l-2.268-9.64a3.375 3.375 0 0 0-3.285-2.602H7.923a3.375 3.375 0 0 0-3.285 2.602l-2.268 9.64a4.5 4.5 0 0 0-.12 1.03v.228m19.5 0a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3m19.5 0a3 3 0 0 0-3-3H5.25a3 3 0 0 0-3 3m16.5 0h.008v.008h-.008v-.008Zm-3 0h.008v.008h-.008v-.008Z" />

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v17.25m0 0c-1.472 0-2.882.265-4.185.75M12 20.25c1.472 0 2.882.265 4.185.75M18.75 4.97A48.416 48.416 0 0 0 12 4.5c-2.291 0-4.545.16-6.75.47m13.5 0c1.01.143 2.01.317 3 .52m-3-.52 2.62 10.726c.122.499-.106 1.028-.589 1.202a5.988 5.988 0 0 1-2.031.352 5.988 5.988 0 0 1-2.031-.352c-.483-.174-.711-.703-.59-1.202L18.75 4.971Zm-16.5.52c.99-.203 1.99-.377 3-.52m0 0 2.62 10.726c.122.499-.106 1.028-.589 1.202a5.989 5.989 0 0 1-2.031.352 5.989 5.989 0 0 1-2.031-.352c-.483-.174-.711-.703-.59-1.202L5.25 4.971Z" />
        </svg>
        Server Rules
      </span> ↗
    </button>

    <button class="link-button external" onclick="window.open('https://dashboard.ticketsbot.cloud/manage/815563382211739670/transcripts', '_blank')">
      <span class="link-label">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 0 1 0 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 0 1 0-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375Z" />

    <button class="link-button external" onclick="window.open('sop-redirect.html', '_blank')">
  <span class="link-label">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h6m-6 4h10M4 6h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V7a1 1 0 011-1z" />

    Staff SOPs
  	</span> ↗

    <div class="sidebar-foot">Hold the refresh button to reload every tool.</div>
  </div>

  <div class="iframes">
    <section class="welcome" id="welcome">
      <div class="welcome-inner">
        <span class="eyebrow">Staff Tool Hub</span>
        <h2>Kia ora 👋 What are we doing today?</h2>
        <p class="lead">Pick a tool to get started. Everything you generate is click-to-copy, ready to paste into Discord or TX.</p>
        <div class="cards" id="cards"></div>
      </div>
    </section>

    <iframe id="tool-evidence" class="tool-frame" src="https://nzdurriez.github.io/StaffHub/EvidenceGenerator/"></iframe>
    <iframe id="tool-ban" class="tool-frame" src="https://nzdurriez.github.io/StaffHub/BanAppealTemplate/"></iframe>
    <iframe id="tool-3sp" class="tool-frame" src="https://nzdurriez.github.io/StaffHub/3SPGenerator/"></iframe>
	<iframe id="tool-3spremoval" class="tool-frame" src="https://nzdurriez.github.io/StaffHub/3SP%20Removal/"></iframe>
    <iframe id="tool-civ" class="tool-frame" src="https://nzdurriez.github.io/StaffHub/CIV+Generator/"></iframe>
    <iframe id="tool-punishment" class="tool-frame" src="https://nzdurriez.github.io/PunishmentGuidelines/staff/"></iframe>
    <iframe id="tool-commands" class="tool-frame" src="https://nzdurriez.github.io/StaffHub/commands.html"></iframe>

    <div class="refresh-icon-wrapper">
      <div class="refresh-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
      </div>
    </div>
  </div>

  <script>
    let refreshTimeout;
    let refreshAllTriggered = false;

    function showTool(id) {
      document.querySelectorAll('.tool-frame').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('welcome').hidden = true;
      document.querySelectorAll('.link-button').forEach(b =>
        b.classList.toggle('active', (b.getAttribute('onclick') || '').includes(`'${id}'`)));
    }

    function showHome() {
      document.querySelectorAll('.tool-frame').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.link-button').forEach(b => b.classList.remove('active'));
      document.getElementById('welcome').hidden = false;
    }

    // Welcome cards are built from the sidebar buttons so the two never drift apart.
    const blurbs = {
      'tool-evidence': 'Build a case write-up with background, evidence and the final result.',
      'tool-ban': 'Log a ban appeal outcome, plus the 3SP message if it was successful.',
      'tool-3sp': 'Generate the 3SP notice with a tally of recent kicks, warns and bans.',
      'tool-3spremoval': 'Let members know they’ve completed 3SP. Manager approval needed.',
      'tool-civ': 'Accept or deny a CIV+ application and create its log entry.',
      'tool-punishment': 'Check the punishment guidelines before taking action.',
      'tool-commands': 'Every in-game and Discord staff command in one place.'
    };
    document.querySelectorAll('.link-button:not(.external)').forEach(btn => {
      const id = (btn.getAttribute('onclick').match(/'([^']+)'/) || [])[1];
      if (!id) return;
      const card = document.createElement('button');
      card.className = 'card';
      card.onclick = () => showTool(id);
      const svg = btn.querySelector('svg').cloneNode(true);
      const name = btn.querySelector('.link-label').textContent.trim();
      card.innerHTML = `<div class="ico"></div><b></b><span></span>`;
      card.querySelector('.ico').appendChild(svg);
      card.querySelector('b').textContent = name;
      card.querySelector('span').textContent = blurbs[id] || '';
      document.getElementById('cards').appendChild(card);
    });

    function refreshCurrentFrame(button) {
      const currentFrame = document.querySelector('.tool-frame.active');
      if (currentFrame) {
        button.classList.add('spin');
        currentFrame.src = currentFrame.src;
        setTimeout(() => {
          button.classList.remove('spin');
        }, 400);
      }
    }

    function refreshAllFrames(button) {
      button.classList.add('spin');
      document.querySelectorAll('.tool-frame').forEach(frame => {
        frame.src = frame.src;
      });
      setTimeout(() => {
        button.classList.remove('spin');
      }, 600);
    }

    const refreshButton = document.querySelector('.refresh-icon');

    refreshButton.addEventListener('mousedown', () => {
      refreshAllTriggered = false;
      refreshTimeout = setTimeout(() => {
        refreshAllTriggered = true;
        refreshAllFrames(refreshButton);
      }, 750); // 0.75 seconds
    });

    refreshButton.addEventListener('mouseup', () => {
      clearTimeout(refreshTimeout);
      if (!refreshAllTriggered) {
        refreshCurrentFrame(refreshButton);
      }
    });

    refreshButton.addEventListener('mouseleave', () => {
      clearTimeout(refreshTimeout);
    });
  </script>

</body>
</html>
