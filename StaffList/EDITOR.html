<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff List Editor</title>
  <link rel="stylesheet" href="../theme.css" />
  <style>
    /* Staff List Editor layout only; look & feel comes from ../theme.css */
    .main-container { max-width: 1200px; margin: 0 auto; }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    .form-panel, .table-panel { padding: 22px; }
    .form-panel { position: sticky; top: 20px; }

    .form-element { display: flex; flex-direction: column; margin-bottom: 14px; }
    .form-element button { margin-top: 0; }
    .form-element:has(#importFile) {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    /* Import / Download are secondary actions */
    .form-element:has(#importFile) ~ .form-element button {
      color: var(--ink);
      background: var(--card-2);
      border: 1px solid var(--line-2);
      box-shadow: none;
    }
    .form-element:has(#importFile) ~ .form-element button:hover { border-color: var(--honey); filter: none; }

    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th {
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--line);
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 500; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: rgba(255,255,255,.02); }
    tbody:empty::after {
      content: "No staff loaded yet. Import staff.json or add someone.";
      display: block;
      padding: 28px 12px;
      color: var(--muted);
    }

    .drag-handle { cursor: grab; text-align: center; user-select: none; width: 40px; opacity: .5; }
    .drag-handle:hover { opacity: 1; }
    .drag-handle svg { display: inline-block; vertical-align: middle; }
    tr.dragging, .sortable-ghost { opacity: .5; }

    .remove-btn {
      width: auto;
      margin: 0;
      padding: 6px 12px;
      font-size: 13px;
      color: #fca5a5;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.35);
      box-shadow: none;
    }
    .remove-btn:hover { background: rgba(239,68,68,.2); filter: none; box-shadow: none; }

    .role-label {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
      border: 1px solid currentColor;
    }
    .role-Director { color: #facc15; background: rgba(250,204,21,.1); }
    .role-Executive { color: #c084fc; background: rgba(192,132,252,.1); }
    .role-Manager { color: #f87171; background: rgba(248,113,113,.1); }
    .role-Administrator { color: #22d3ee; background: rgba(34,211,238,.1); }
    .role-Moderator { color: #60a5fa; background: rgba(96,165,250,.1); }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .form-panel { position: static; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body class="tool-page">
  <div class="main-container">
    <h2 class="title">Staff List Editor</h2>
    <div class="layout">
      <div class="form-panel">
        <div class="form-element">
          <label for="name">Staff Member</label>
          <input type="text" id="name" placeholder="e.g. OnSmoko" />
        </div>

        <div class="form-element">
          <label for="role">Role</label>
          <select id="role">
            <option value="Moderator">Moderator</option>
            <option value="Administrator">Administrator</option>
            <option value="Manager">Manager</option>
            <option value="Executive">Executive</option>
            <option value="Director">Director</option>
          </select>
        </div>

        <!-- Sort by dropdown -->
        <div class="form-element">
          <label for="sort">Sort by</label>
          <select id="sort" onchange="sortStaff()">
            <option value="">-- Select --</option>
            <option value="alphabetical">Alphabetical</option>
            <option value="role">Role</option>
          </select>
        </div>

        <div class="form-element">
          <button onclick="addStaff()">Add User</button>
        </div>

        <div class="form-element">
          <input type="file" id="importFile" accept=".json" />
        </div>

        <div class="form-element">
          <button onclick="importJSON()">Import</button>
        </div>

        <div class="form-element">
          <button onclick="downloadJSON()">Download</button>
        </div>
      </div>

      <div class="table-panel">
        <table id="staffTable">
          <thead>
            <tr>
              <th></th>
              <th>Name</th>
              <th>Role</th>
              <th>Remove</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let staff = [];

    function renderTable() {
      const tbody = document.querySelector("#staffTable tbody");
      tbody.innerHTML = "";
      staff.forEach((s, i) => {
        const row = document.createElement("tr");
        const roleClass = s.role.replace(/\s/g, '');
        row.innerHTML = `
          <td class="drag-handle" title="Drag to reorder">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M2 4h12v1H2V4zm0 3h12v1H2V7zm0 3h12v1H2v-1z"/>
            </svg>
          </td>
          <td>${s.name}</td>
          <td><span class="role-label role-${roleClass}">${s.role}</span></td>
          <td><button class="remove-btn" onclick="removeStaff(${i})">Remove</button></td>
        `;
        row.setAttribute("data-id", i);
        tbody.appendChild(row);
      });
    }

    function addStaff() {
      const name = document.getElementById("name").value.trim();
      const role = document.getElementById("role").value;
      if (name && role) {
        staff.push({ name, role });
        renderTable();
        document.getElementById("name").value = "";
      }
    }

    function removeStaff(index) {
      staff.splice(index, 1);
      renderTable();
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify(staff, null, 2)], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "staff.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON() {
      const fileInput = document.getElementById("importFile");
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data)) {
            staff = data;
            renderTable();
          } else {
            alert("Invalid JSON format");
          }
        } catch (err) {
          alert("Failed to parse JSON: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    function sortStaff() {
      const sortType = document.getElementById("sort").value;
      
      if (sortType === "alphabetical") {
        staff.sort((a, b) => a.name.localeCompare(b.name));
      } else if (sortType === "role") {
        const hierarchy = ["Director", "Executive", "Manager", "Administrator", "Moderator"];
        staff.sort((a, b) => hierarchy.indexOf(a.role) - hierarchy.indexOf(b.role));
      }
      
      renderTable();
    }

    new Sortable(document.querySelector("#staffTable tbody"), {
      handle: ".drag-handle",
      animation: 150,
      onEnd: () => {
        const newOrder = [];
        document.querySelectorAll("#staffTable tbody tr").forEach(row => {
          const index = parseInt(row.getAttribute("data-id"));
          newOrder.push(staff[index]);
        });
        staff = newOrder;
        renderTable();
      }
    });
  </script>
</body>
</html>
